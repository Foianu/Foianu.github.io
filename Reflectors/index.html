<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foianu — Portfolio</title>
<meta name="description" content="Web projects by Valentina Foianu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --ink: #151515;
    --mute: #8a8984;
    --line: rgba(21, 21, 21, .22);
    --fs-s: 11px;
    --fs-m: clamp(15px, 1.3vw, 19px);
    --fs-l: clamp(36px, 5.4vw, 84px);
    --gutter: clamp(16px, 3.2vw, 48px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: var(--fs-m); line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .cap { font-size: var(--fs-s); text-transform: uppercase; letter-spacing: .02em; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px var(--gutter); }
  main { padding: 0 var(--gutter) 96px; }
  h1 { margin: clamp(64px, 10vw, 160px) 0 0; font-weight: 400; font-size: var(--fs-l); line-height: 1.04; letter-spacing: -.02em; }
  .intro { margin: 24px 0 0; max-width: 38ch; color: var(--mute); }

  /* project list: one row per project */
  .list { margin: clamp(64px, 10vw, 140px) 0 0; padding: 0; list-style: none; border-top: 1px solid var(--ink); }
  .row {
    display: grid; grid-template-columns: 3ch 160px 1fr auto auto; gap: 24px; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .row img { display: block; width: 160px; aspect-ratio: 3 / 1; object-fit: cover; background: #ddd; }
  .row h2 { margin: 0; font-weight: 500; font-size: var(--fs-m); }
  .row p { margin: 2px 0 0; color: var(--mute); font-size: var(--fs-s); }
  .row a.go { border-bottom: 1px solid currentColor; font-size: var(--fs-s); text-transform: uppercase; }
  .row a.go:hover { color: #1f3cff; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 3ch 1fr; row-gap: 10px; }
    .row img { grid-column: 2; width: 100%; }
    .row .title { grid-column: 2; }
    .row a.go { grid-column: 2; justify-self: start; }
  }
</style>
</head>
<body>

<header class="cap">
  <span>Foianu</span>
  <span>Portfolio</span>
</header>

<main>
  <h1>Web<br>Projects</h1>
  <p class="intro">Concept sites and experiments. Each project opens as a live site, with its code on GitHub.</p>

  <!-- To add a project: copy one <li> block, change the number, image, name and the two links. -->
  <ol class="list">
    <li class="row">
      <span class="cap">01</span>
      <img src="https://foianu.github.io/Reflectors/img/Artboard%201.jpg" alt="Reflectors preview">
      <div class="title">
        <h2>Reflectors</h2>
        <p>Catalogue of rear lamps and reflectors, 2026</p>
      </div>
      <a class="go" href="https://foianu.github.io/Reflectors/">Site ↗</a>
      <a class="go" href="https://github.com/Foianu/Foianu.github.io/tree/main/Reflectors">Code ↗</a>
    </li>
  </ol>
</main>

</body>
</html>
